[sources]
include = ["src/**/*.cpp", "src/**/*.h", "sample/*.cpp"]
exclude = []

[matrix]
arch = ["x86", "x64"]
build = ["dbg", "rel"]
toolchain = ["msvc"]

[[preset]]
name = "{toolchain}-{arch}-{build}"

[[variable]]
key_on = "build"
steps = [
    ["dbg", ["setup", "build"]],
    ["rel", ["setup", "build", "install", "check", "format"]],
]

[[variable]]
key_on = "arch"
plugin_dir = [
    ["x86", "Binaries/Plugins"],
    ["x64", "Binaries/Win64/Plugins"],
]

[[package]]
archive = "{project}-{version}-{toolchain}-{arch}"
preset = "*-rel"
files = [{ include = ["blcore.dll", "blcore.pdb"], dest = "{plugin_dir}" }]
